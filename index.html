<title>🎬 Movie Night Poll</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1220;
    --card: #1b1f33;
    --card-2: #232845;
    --accent: #ffb347;
    --accent-2: #ff6b9d;
    --text: #eef1ff;
    --muted: #9aa3c7;
    --good: #4ade80;
  }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #2a2f52 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.07);
  }
  h1 { font-size: 1.5rem; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 20px; }

  /* Progress */
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .progress {
    flex: 1; height: 8px; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px; transition: width .35s ease;
  }
  .progress-label { font-size: .8rem; color: var(--muted); white-space: nowrap; }

  /* Movie card */
  .poster-wrap { text-align: center; margin-bottom: 18px; }
  .poster-img {
    height: 240px; max-width: 100%; border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.12); object-fit: cover;
  }
  .winner-poster { height: 130px; border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,.5); margin-bottom: 6px; }
  .thumb { height: 44px; border-radius: 6px; vertical-align: middle; margin-right: 4px; }
  .movie-title { font-size: 1.35rem; margin-bottom: 4px; }
  .movie-meta { color: var(--accent); font-size: .85rem; font-weight: 600; margin-bottom: 14px; }
  .synopsis { color: #c9d0ee; line-height: 1.55; font-size: .95rem; margin-bottom: 24px; }

  /* Vote buttons */
  .vote-label { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .votes { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .vote-btn {
    padding: 9px 0 7px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
    background: var(--card-2); color: var(--text);
    font-size: .95rem; font-weight: 700;
    cursor: pointer; transition: transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .vote-btn span { display: block; font-size: .52rem; font-weight: 500; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .vote-btn:hover { transform: translateY(-3px); border-color: var(--accent); }
  .vote-btn:active { transform: translateY(0) scale(.96); }
  .vote-btn.selected {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #1a1020; border-color: transparent;
  }
  .vote-btn.selected span { color: rgba(0,0,0,.55); }

  .nav { display: flex; justify-content: space-between; margin-top: 22px; }
  .nav button {
    padding: 10px 18px; border-radius: 12px; border: none;
    background: var(--card-2); color: var(--text);
    font-size: .9rem; font-weight: 600; cursor: pointer;
    transition: background .15s ease;
  }
  .nav button:hover { background: #2d3458; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a1020; }
  .nav .primary:hover { filter: brightness(1.08); }
  .nav .primary:disabled { filter: grayscale(.6); opacity: .4; }

  /* Results */
  .results-hero {
    text-align: center; padding: 22px 16px; border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,179,71,.18), rgba(255,107,157,.18));
    border: 1px solid rgba(255,179,71,.35);
    margin-bottom: 22px;
  }
  .results-hero .crown { font-size: 2.4rem; }
  .results-hero .tag { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; margin: 6px 0 2px; }
  .results-hero .winner { font-size: 1.4rem; font-weight: 800; }
  .results-hero .winner-meta { color: var(--accent); font-size: .85rem; margin-top: 3px; }
  .avg { color: var(--good); font-weight: 700; }

  .result-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 12px; margin-bottom: 8px;
    background: var(--card-2);
  }
  .result-row.top { border: 1px solid rgba(255,179,71,.5); }
  .result-row .rank { width: 26px; text-align: center; font-weight: 800; color: var(--muted); }
  .result-row.top .rank { color: var(--accent); }
  .result-row .info { flex: 1; min-width: 0; }
  .result-row .name { font-size: .92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-row .bar-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
  .result-row .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .result-row .score { font-weight: 800; font-size: 1rem; width: 34px; text-align: right; }

  .restart {
    width: 100%; margin-top: 12px; padding: 13px;
    border-radius: 14px; border: none; cursor: pointer;
    background: var(--card-2); color: var(--text);
    font-size: .95rem; font-weight: 600;
  }
  .restart:hover { background: #2d3458; }
  #btn-copy { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a1020; }

  .hidden { display: none; }
</style>
</head>

<div class="app">

  <!-- ===== VOTING SCREEN ===== -->

</div>

const voteLabels = ["Hard no", "", "", "", "", "Meh", "", "", "", "", "IN! 🍿"];
let current = 0;
const ratings = new Array(movies.length).fill(null);

const $ = id => document.getElementById(id);
const voteScreen = $("vote-screen"), resultsScreen = $("results-screen");

function render() {
  const m = movies[current];
  const _p = POSTERS[m.title]; const _img = $("poster-img"); _img.style.display = _p ? "" : "none"; _img.src = _p || "";
  $("movie-title").textContent = m.title;
  $("movie-meta").textContent = `${m.year} · ${m.genre}`;
  $("synopsis").textContent = m.synopsis;
  $("progress-fill").style.width = ((current + 1) / movies.length * 100) + "%";
  $("progress-label").textContent = `${current + 1} / ${movies.length}`;
  $("btn-prev").disabled = current === 0;
  $("btn-next").textContent = current === movies.length - 1 ? "See results →" : "Next →";

  const votesEl = $("votes");
  votesEl.innerHTML = "";
  for (let v = 0; v <= 10; v++) {
    const btn = document.createElement("button");
    btn.className = "vote-btn" + (ratings[current] === v ? " selected" : "");
    btn.innerHTML = `${v}<span>${voteLabels[v] || ""}</span>`;
    btn.onclick = () => { ratings[current] = v; render(); };
    votesEl.appendChild(btn);
  }
  $("btn-next").disabled = ratings[current] === null;
}

function getRanked() {
  return movies
    .map((m, i) => ({ ...m, rating: ratings[i] }))
    .sort((a, b) => b.rating - a.rating || a.title.localeCompare(b.title));
}

function showResults() {
  voteScreen.classList.add("hidden");
  resultsScreen.classList.remove("hidden");

  const ranked = getRanked();
  const top = ranked[0];
  const avg = (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
  $("results-hero").innerHTML = `
    <img class="winner-poster" src="${POSTERS[top.title]}" alt="" onerror="this.style.display='none'">
    <div class="tag">You want to watch most</div>
    <div class="winner">${top.emoji} ${top.title}</div>
    <div class="winner-meta">${top.year} · ${top.genre} — you gave it a ${top.rating}/10</div>
    <div class="winner-meta">Overall average across all movies: <span class="avg">${avg} / 10</span></div>
  `;

  const list = $("results-list");
  list.innerHTML = "";
  ranked.forEach((m, idx) => {
    const row = document.createElement("div");
    row.className = "result-row" + (idx === 0 ? " top" : "");
    row.innerHTML = `
      <div class="rank">${idx + 1}</div>
      <div class="info">
        <div class="name"><img class="thumb" src="${POSTERS[m.title]}" alt="" onerror="this.style.display='none'"> ${m.title} <span style="color:var(--muted);font-weight:400">(${m.year})</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${m.rating / 10 * 100}%"></div></div>
      </div>
      <div class="score">${m.rating}</div>
    `;
    list.appendChild(row);
  });
}

$("btn-prev").onclick = () => { if (current > 0) { current--; render(); } };
$("btn-next").onclick = () => {
  if (ratings[current] === null) return;
  if (current === movies.length - 1) { showResults(); }
  else { current++; render(); }
};
$("btn-restart").onclick = () => {
  current = 0;
  ratings.fill(null);
  resultsScreen.classList.add("hidden");
  voteScreen.classList.remove("hidden");
  render();
};

$("btn-copy").onclick = async () => {
  const ranked = getRanked();
  const top = ranked[0];
  const lines = ranked.map((m, idx) => `${idx + 1}. ${m.title} (${m.year}) — ${m.rating}/10`);
  const text = `🎬 My Movie Night Poll results!\n👑 Most wanted: ${top.title} (${top.year}) — ${top.rating}/10\n\n${lines.join("\n")}`;
  try {
    await navigator.clipboard.writeText(text);
    $("btn-copy").textContent = "✅ Copied to clipboard!";
  } catch (e) {
    window.prompt("Copy your results (Ctrl+C):", text);
  }
  setTimeout(() => { $("btn-copy").textContent = "📋 Copy my results"; }, 2500);
};

render();
</script>
